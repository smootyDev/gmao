spring:
  application:
    name: gmao-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gmao}
    username: ${SPRING_DATASOURCE_USERNAME:gmao}
    password: ${SPRING_DATASOURCE_PASSWORD:gmao_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:wdnKIPY7LxULcvqqX8JAzSU4a/C7ATWwyqstb021TPI=}
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
