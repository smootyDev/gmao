<div class="layout-wrapper">
  <p-toolbar >
    <div class="p-toolbar-group-start">
      <button pButton type="button" class="p-button-text" aria-label="Menu" (click)="toggleSidebar()">
        <i class="pi pi-bars" pButtonIcon></i>
      </button>
      <span class="ml-3 text-xl font-bold">GMAO CMMS</span>
    </div>

    <div class="p-toolbar-group-end flex gap-2">
      <button pButton type="button" class="p-button-text" aria-label="Toggle theme" (click)="themeService.toggleTheme()">
        <i [class]="themeService.darkMode() ? 'pi pi-sun' : 'pi pi-moon'" pButtonIcon></i>
      </button>

      <button pButton type="button" class="p-button-text" aria-label="Language" (click)="languageMenu.toggle($event)">
        <i class="pi pi-globe" pButtonIcon></i>
      </button>
      <p-menu #languageMenu [popup]="true" [model]="languageItems"></p-menu>

      <button pButton type="button" class="p-button-text" (click)="userMenu.toggle($event)">
        <i class="pi pi-user" pButtonIcon></i>
        <span pButtonLabel>{{ authService.currentUser()?.username || '' }}</span>
      </button>
      <p-menu #userMenu [popup]="true" [model]="userMenuItems"></p-menu>
    </div>
  </p-toolbar>

  <div class="layout-content flex">
    <aside class="layout-sidebar surface-card border-right-1 surface-border" [class.collapsed]="!sidebarVisible">
      <nav class="p-3">
        <ul class="list-none p-0 m-0 flex flex-column gap-2">
          <li *ngFor="let item of menuItems">
            <a [routerLink]="item.routerLink"
               routerLinkActive="active"
               class="flex align-items-center gap-2 p-3 border-round-lg text-color hover:surface-hover no-underline transition-colors transition-duration-200">
              <i [class]="item.icon"></i>
              <span *ngIf="sidebarVisible">{{ item.label | translate }}</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 p-4 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
