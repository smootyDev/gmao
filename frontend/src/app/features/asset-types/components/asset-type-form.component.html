<div class="fadein max-w-900 mx-auto">
  <h1 class="text-3xl font-bold mb-4">
    {{ (isEdit() ? 'ASSET_TYPES.EDIT' : 'ASSET_TYPES.NEW') | translate }}
  </h1>

  <p-card class="shadow-2">
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
      <div class="formgrid grid" *ngIf="isEdit()">
        <div class="field col-12 md:col-3">
          <label for="id">{{ 'COMMON.ID' | translate }}</label>
          <input pInputText id="id" [value]="id()" disabled class="w-full" />
        </div>
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-4">
          <label for="code">{{ 'ASSET_TYPES.CODE' | translate }}</label>
          <input pInputText id="code" formControlName="code" class="w-full" />
        </div>
        <div class="field col-12 md:col-8">
          <label for="name">{{ 'ASSET_TYPES.NAME' | translate }}</label>
          <input pInputText id="name" formControlName="name" class="w-full" />
        </div>
      </div>

      <div class="field">
        <label for="description">{{ 'ASSET_TYPES.DESCRIPTION' | translate }}</label>
        <textarea pTextarea id="description" formControlName="description" rows="3" class="w-full"></textarea>
      </div>

      <div class="field flex align-items-center gap-2">
        <p-checkbox inputId="active" formControlName="active" [binary]="true"></p-checkbox>
        <label for="active">{{ 'ASSET_TYPES.ACTIVE' | translate }}</label>
      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <button pButton type="button" severity="secondary" routerLink="/asset-types">
          <i class="pi pi-times" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.CANCEL' | translate }}</span>
        </button>
        <button pButton type="submit" [loading]="saving()">
          <i class="pi pi-check" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.SAVE' | translate }}</span>
        </button>
      </div>
    </form>
  </p-card>
</div>
