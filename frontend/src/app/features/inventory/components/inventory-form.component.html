<div class="fadein mx-auto">
  <h1 class="text-3xl font-bold mb-4">
    {{ (isEdit() ? 'INVENTORY.EDIT' : 'INVENTORY.NEW') | translate }}
  </h1>

  <p-card class="shadow-2">
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
      @if (isEdit()) {
        <div class="formgrid grid">
          <div class="field col-12 md:col-3">
            <label for="id">{{ 'COMMON.ID' | translate }}</label>
            <input pInputText id="id" [value]="id()" disabled class="w-full" />
          </div>
        </div>
      }

      <div class="formgrid grid">
        <div class="field col-12 md:col-4">
          <label for="code">{{ 'INVENTORY.CODE' | translate }}</label>
          <input pInputText id="code" formControlName="code" class="w-full" />
        </div>
        <div class="field col-12 md:col-8">
          <label for="name">{{ 'INVENTORY.NAME' | translate }}</label>
          <input pInputText id="name" formControlName="name" class="w-full" />
        </div>
      </div>

      <div class="field">
        <label for="description">{{ 'INVENTORY.DESCRIPTION' | translate }}</label>
        <textarea pTextarea id="description" formControlName="description" rows="3" class="w-full"></textarea>
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-4">
          <label for="category">{{ 'INVENTORY.CATEGORY' | translate }}</label>
          <p-select inputId="category" formControlName="category" [options]="categoryOptions" optionLabel="label" optionValue="value" [showClear]="true" [placeholder]="'-'" styleClass="w-full"></p-select>
        </div>

        <div class="field col-12 md:col-4">
          <label for="unit">{{ 'INVENTORY.UNIT' | translate }}</label>
          <p-select inputId="unit" formControlName="unit" [options]="unitOptions" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
        </div>

        <div class="field col-12 md:col-4">
          <label for="locationId">{{ 'INVENTORY.LOCATION' | translate }}</label>
          <p-select inputId="locationId" formControlName="locationId" [options]="locations()" optionLabel="name" optionValue="id" [showClear]="true" [placeholder]="'-'" styleClass="w-full">
            <ng-template let-location pTemplate="item">{{ location.code }} - {{ location.name }}</ng-template>
            <ng-template let-location pTemplate="selectedItem">{{ location ? location.code + ' - ' + location.name : '-' }}</ng-template>
          </p-select>
        </div>
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="currentStock">{{ 'INVENTORY.CURRENT_STOCK' | translate }}</label>
          <p-inputnumber inputId="currentStock" formControlName="currentStock" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-full" inputStyleClass="w-full"></p-inputnumber>
        </div>

        <div class="field col-12 md:col-6">
          <label for="minimumStock">{{ 'INVENTORY.MINIMUM_STOCK' | translate }}</label>
          <p-inputnumber inputId="minimumStock" formControlName="minimumStock" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-full" inputStyleClass="w-full"></p-inputnumber>
        </div>
      </div>

      <div class="field flex align-items-center gap-2">
        <p-checkbox inputId="active" formControlName="active" [binary]="true"></p-checkbox>
        <label for="active">{{ 'INVENTORY.ACTIVE' | translate }}</label>
      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <button pButton type="button" severity="secondary" routerLink="/inventory">
          <i class="pi pi-times" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.CANCEL' | translate }}</span>
        </button>
        <button pButton type="submit" [loading]="saving()">
          <i class="pi pi-check" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.SAVE' | translate }}</span>
        </button>
      </div>
    </form>
  </p-card>
</div>

<p-toast></p-toast>
