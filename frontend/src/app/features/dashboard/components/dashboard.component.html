<div class="fadein">
  <h1 class="text-3xl font-bold mb-4">{{ 'DASHBOARD.TITLE' | translate }}</h1>

  <div class="grid">
    <div class="col-12 md:col-6 lg:col-3">
      <p-card class="kpi-card surface-card shadow-2">
        <div class="flex justify-content-between align-items-center">
          <div>
            <p class="text-secondary m-0">{{ 'DASHBOARD.OPEN' | translate }}</p>
            <p class="text-4xl font-bold m-0">{{ openCount() }}</p>
          </div>
          <i class="pi pi-folder-open text-primary text-4xl"></i>
        </div>
      </p-card>
    </div>

    <div class="col-12 md:col-6 lg:col-3">
      <p-card class="kpi-card surface-card shadow-2">
        <div class="flex justify-content-between align-items-center">
          <div>
            <p class="text-secondary m-0">{{ 'DASHBOARD.IN_PROGRESS' | translate }}</p>
            <p class="text-4xl font-bold m-0">{{ inProgressCount() }}</p>
          </div>
          <i class="pi pi-spinner text-orange-500 text-4xl"></i>
        </div>
      </p-card>
    </div>

    <div class="col-12 md:col-6 lg:col-3">
      <p-card class="kpi-card surface-card shadow-2">
        <div class="flex justify-content-between align-items-center">
          <div>
            <p class="text-secondary m-0">{{ 'DASHBOARD.CLOSED' | translate }}</p>
            <p class="text-4xl font-bold m-0">{{ closedCount() }}</p>
          </div>
          <i class="pi pi-check-circle text-green-500 text-4xl"></i>
        </div>
      </p-card>
    </div>

    <div class="col-12 md:col-6 lg:col-3">
      <p-card class="kpi-card surface-card shadow-2">
        <div class="flex justify-content-between align-items-center">
          <div>
            <p class="text-secondary m-0">{{ 'DASHBOARD.URGENT' | translate }}</p>
            <p class="text-4xl font-bold m-0">{{ urgentCount() }}</p>
          </div>
          <i class="pi pi-exclamation-triangle text-red-500 text-4xl"></i>
        </div>
      </p-card>
    </div>
  </div>
</div>
