<div class="fadein mx-auto">
  <h1 class="text-3xl font-bold mb-4">
    {{ (isEdit() ? 'ASSETS.EDIT' : 'ASSETS.NEW') | translate }}
  </h1>

  <p-card class="shadow-2">
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
      @if (isEdit()) {
        <div class="formgrid grid">
          <div class="field col-12 md:col-3">
            <label for="id">{{ 'COMMON.ID' | translate }}</label>
            <input pInputText id="id" [value]="id()" disabled class="w-full" />
          </div>
        </div>
      }

      <div class="field">
        <label for="name">{{ 'ASSETS.NAME' | translate }}</label>
        <input pInputText id="name" formControlName="name" class="w-full" />
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="typeId">{{ 'ASSETS.TYPE' | translate }}</label>
          <p-select inputId="typeId" formControlName="typeId" [options]="assetTypes()" optionLabel="name" optionValue="id" [showClear]="true" [placeholder]="'-'" styleClass="w-full">
            <ng-template let-assetType pTemplate="item">{{ assetType.code }} - {{ assetType.name }}</ng-template>
            <ng-template let-assetType pTemplate="selectedItem">{{ assetType ? assetType.code + ' - ' + assetType.name : '-' }}</ng-template>
          </p-select>
        </div>

        <div class="field col-12 md:col-6">
          <label for="serialNumber">{{ 'ASSETS.SERIAL_NUMBER' | translate }}</label>
          <input pInputText id="serialNumber" formControlName="serialNumber" class="w-full" />
        </div>
      </div>

      <div class="field">
        <label for="description">{{ 'ASSETS.DESCRIPTION' | translate }}</label>
        <textarea pTextarea id="description" formControlName="description" rows="3" class="w-full"></textarea>
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="criticality">{{ 'ASSETS.CRITICALITY' | translate }}</label>
          <p-select inputId="criticality" formControlName="criticality" [options]="criticalities" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
        </div>

        <div class="field col-12 md:col-6">
          <label for="status">{{ 'ASSETS.STATUS' | translate }}</label>
          <p-select inputId="status" formControlName="status" [options]="statuses" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
        </div>
      </div>

      <div class="formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="locationId">{{ 'ASSETS.LOCATION' | translate }}</label>
          <p-select inputId="locationId" formControlName="locationId" [options]="locations()" optionLabel="name" optionValue="id" [showClear]="true" [placeholder]="'-'" styleClass="w-full">
            <ng-template let-location pTemplate="item">{{ location.code }} - {{ location.name }}</ng-template>
            <ng-template let-location pTemplate="selectedItem">{{ location ? location.code + ' - ' + location.name : '-' }}</ng-template>
          </p-select>
        </div>

        <div class="field col-12 md:col-3">
          <label for="hoursOfUse">{{ 'ASSETS.HOURS_OF_USE' | translate }}</label>
          <p-inputnumber inputId="hoursOfUse" formControlName="hoursOfUse" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="1" [useGrouping]="false" styleClass="w-full" inputStyleClass="w-full"></p-inputnumber>
        </div>

        <div class="field col-12 md:col-3">
          <label for="purchaseDate">{{ 'ASSETS.PURCHASE_DATE' | translate }}</label>
          <p-datepicker inputId="purchaseDate" formControlName="purchaseDate" dateFormat="yy-mm-dd" [showIcon]="true" styleClass="w-full" inputStyleClass="w-full"></p-datepicker>
        </div>
      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <button pButton type="button" severity="secondary" routerLink="/assets">
          <i class="pi pi-times" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.CANCEL' | translate }}</span>
        </button>
        <button pButton type="submit" [loading]="saving()">
          <i class="pi pi-check" pButtonIcon></i>
          <span pButtonLabel>{{ 'COMMON.SAVE' | translate }}</span>
        </button>
      </div>
    </form>
  </p-card>
</div>

<p-toast></p-toast>
