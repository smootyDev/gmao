<div class="fadein max-w-900 mx-auto"><h1 class="text-3xl font-bold mb-4">{{ (isEdit() ? 'USERS.EDIT' : 'USERS.NEW') | translate }}</h1><p-card class="shadow-2"><form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
  @if (isEdit()) {
    <div class="formgrid grid"><div class="field col-12 md:col-3"><label>{{ 'COMMON.ID' | translate }}</label><input pInputText [value]="id()" disabled class="w-full" /></div></div>
  }
  <div class="formgrid grid"><div class="field col-12 md:col-4"><label>{{ 'USERS.EMPLOYEE_CODE' | translate }}</label><input pInputText formControlName="employeeCode" class="w-full" /></div><div class="field col-12 md:col-4"><label>{{ 'USERS.FIRST_NAME' | translate }}</label><input pInputText formControlName="firstName" class="w-full" /></div><div class="field col-12 md:col-4"><label>{{ 'USERS.LAST_NAME' | translate }}</label><input pInputText formControlName="lastName" class="w-full" /></div></div>
  <div class="formgrid grid"><div class="field col-12 md:col-6"><label>{{ 'USERS.USERNAME' | translate }}</label><input pInputText formControlName="username" class="w-full" /></div><div class="field col-12 md:col-6"><label>{{ 'USERS.EMAIL' | translate }}</label><input pInputText formControlName="email" class="w-full" /></div></div>
  <div class="formgrid grid"><div class="field col-12 md:col-4"><label>{{ 'USERS.PHONE' | translate }}</label><input pInputText formControlName="phone" class="w-full" /></div><div class="field col-12 md:col-4"><label>{{ 'USERS.DEPARTMENT' | translate }}</label><input pInputText formControlName="department" class="w-full" /></div><div class="field col-12 md:col-4"><label>{{ 'USERS.ROLE' | translate }}</label><p-select formControlName="role" [options]="roles" optionLabel="label" optionValue="value" styleClass="w-full"></p-select></div></div>
  <div class="field"><label>{{ 'USERS.PASSWORD' | translate }}</label><p-password formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password></div>
  <div class="flex align-items-center gap-2"><p-checkbox formControlName="active" [binary]="true" inputId="active"></p-checkbox><label for="active">{{ 'USERS.ACTIVE' | translate }}</label></div>
  <div class="flex justify-content-end gap-2"><button pButton type="button" severity="secondary" routerLink="/users">{{ 'COMMON.CANCEL' | translate }}</button><button pButton type="submit" [loading]="saving()">{{ 'COMMON.SAVE' | translate }}</button></div>
</form></p-card></div>
