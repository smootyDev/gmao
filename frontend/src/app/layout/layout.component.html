<div class="layout-wrapper" [ngClass]="containerClass()">
  <app-layout-topbar></app-layout-topbar>
  <app-layout-sidebar></app-layout-sidebar>
  <app-sync-status></app-sync-status>

  <div class="layout-content-wrapper">
    <div class="layout-content">
      <div class="layout-content-inner">
        <router-outlet></router-outlet>
        <app-layout-footer></app-layout-footer>
      </div>
    </div>
  </div>

  <div class="layout-mask" (click)="hideMenu()"></div>
</div>

@if (aiState.enabled()) {
  <button
    pButton
    type="button"
    class="ai-fab"
    icon="pi pi-android"
    rounded
    [title]="'AI.TITLE' | translate"
    (click)="openAiChat()"
  ></button>
}

<p-dialog
  [(visible)]="aiDialogVisible"
  [header]="'AI.TITLE' | translate"
  [modal]="true"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: '560px', maxHeight: '80vh' }"
>
  @defer (when aiDialogVisible()) {
    <app-ai-chat [embedded]="true" (createWorkOrder)="aiDialogVisible.set(false)"></app-ai-chat>
  } @placeholder {
    <div class="flex justify-content-center align-items-center" style="height: 420px">
      <i class="pi pi-spin pi-spinner text-2xl text-color-secondary"></i>
    </div>
  }
</p-dialog>
